name: CP/M port
on:
  push:
  pull_request:
jobs:
  native-atom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node tools/measure.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hyperdrive-cpm
          path: build/
